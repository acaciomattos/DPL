[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "decision-policy-lab"
version = "0.1.0"
description = "Dash-based analytical platform for policy simulation and optimization over frozen study snapshots."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Decision Policy Lab" }
]
dependencies = [
  "duckdb>=1.1.0",
  "polars>=1.10.0",
]

[project.optional-dependencies]
ui = [
  "dash>=2.18.0",
  "plotly>=5.24.0",
]
dev = [
  "pytest>=8.0.0",
  "black>=24.8.0",
  "mypy>=1.11.0",
  "ruff>=0.6.0",
]
docs = [
  "ipykernel>=6.29.0",
  "nbformat>=5.10.0",
]

[project.scripts]
policy-lab-dashboard = "policy_lab.apps.simulator_app.app:main"

[tool.setuptools.packages.find]
include = ["policy_lab*"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_optional = true
disallow_untyped_defs = false
no_implicit_optional = true
